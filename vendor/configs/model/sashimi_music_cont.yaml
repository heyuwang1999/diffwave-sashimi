_name_: sashimi
unconditional: true          # no mel conditioning; conditioning comes from `context`
in_channels: 1
out_channels: 1
diffusion_step_embed_dim_in: 128
diffusion_step_embed_dim_mid: 512
diffusion_step_embed_dim_out: 512
unet: true
self_conditioning: false
# Milestone-2 continuation: encode preceding audio to condition generation.
context_conditioning: true
context_mode: global       # "global" (add summary to step embed) or "cross_attn" (bottleneck attention)
n_context_tokens: 64       # number of context tokens for cross_attn mode
context_d_model: 64
context_n_blocks: 6
d_model: 64
n_layers: 6
pool: [4, 4]
expand: 2
ff: 2
L: ${dataset.segment_length}
