# @package _global_
# Milestone 1: unconditional raw-waveform music generation with SaShiMi+DiffWave.
# Sized for a single A100/L4 (Colab Pro) on a few long source tracks.
#
# Run:  python train.py experiment=music
defaults:
  - /model: sashimi_music
  - /dataset: music

diffusion:
  T: 200
  beta_0: 0.0001
  beta_T: 0.02
  beta: null
  # Tier-0 fidelity knobs (defaults below == original DiffWave; baseline unchanged).
  # A/B by overriding on the CLI or using experiment=music_vpred.
  parameterization: eps    # "eps" (original) or "v" (v-prediction)
  min_snr_gamma: null      # e.g. 5.0 to enable Min-SNR-gamma loss weighting
  schedule: linear         # "linear" (original) or "cosine" (Nichol & Dhariwal)
  stft_loss_weight: 0.0    # e.g. 0.1 to add multi-resolution STFT loss on x0
# Self-conditioning is a model flag (changes input channels): model.self_conditioning=true
# Use a distinct train.name for any A/B variant so checkpoints don't collide.

train:
  batch_size_per_gpu: 8      # A100 40GB headroom at d_model=64, L~44k; lower to 4 on L4/16GB
  n_iters: 500001
  iters_per_ckpt: 5000
  iters_per_logging: 100
  learning_rate: 2e-4

generate:
  n_samples: 4               # samples auto-generated + logged at each checkpoint
  batch_size: null
